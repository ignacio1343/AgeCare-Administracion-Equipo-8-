# Despliegue en Render (Blueprint) con la base de datos en Neon (PostgreSQL gratuito).
# Pasos: ver README, sección «Despliegue en Render + Neon».
# Si Render asigna otro nombre a los servicios, ajusta VITE_API_URL, FRONTEND_URL y CORS_ORIGINS.
# Plan gratuito: la API se suspende tras 15 min sin visitas (tarda ~1 min en despertar) y con ella el planificador;
# así Neon también se suspende y no se agotan las horas de cómputo gratuitas. No usar «pings» para mantenerla despierta.
services:
  # API FastAPI + planificador (contenedor Docker)
  - type: web
    runtime: docker
    name: agecare-admin-api
    plan: free
    region: virginia            # el más cercano a Neon us-east-1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL       # cadena de conexión de Neon (postgresql://...?sslmode=require)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PASARELA_WEBHOOK_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://agecare-admin.onrender.com
      - key: CORS_ORIGINS
        value: https://agecare-admin.onrender.com
      - key: ALLOWED_EMAIL_DOMAINS
        value: wellq.co.uk,agecare.cl
      - key: ZONA_HORARIA
        value: America/Santiago
      - key: PLANIFICADOR_INTERVALO_SEG
        value: "60"

  # Consola (SPA React) como sitio estático en la CDN de Render
  - type: web
    runtime: static
    name: agecare-admin
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://agecare-admin-api.onrender.com
    routes:
      - type: rewrite           # React Router: toda ruta vuelve a index.html
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY

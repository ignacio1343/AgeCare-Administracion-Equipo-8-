# Integración continua (EP10-HU05). Corre en cada push y pull request.
# Render está configurado con autoDeployTrigger: checksPass, así que solo despliega si este workflow pasa.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pruebas, cobertura y seguridad
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agecare_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      PG: postgresql+psycopg://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Migraciones Alembic sobre una base vacía (detecta errores como DEF-04)
        env:
          DATABASE_URL: ${{ env.PG }}/agecare_ci
          PLANIFICADOR_INTERVALO_SEG: "0"
        run: |
          alembic upgrade head
          python -m scripts.seed
          python -m scripts.seed   # el seed debe ser idempotente
          psql "postgresql://postgres:postgres@localhost:5432/agecare_ci" -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_name<>'alembic_version'"

      - name: Pruebas unitarias e integración sobre PostgreSQL + cobertura
        env:
          TEST_DATABASE_URL: ${{ env.PG }}/postgres
        run: |
          pytest -p no:cacheprovider --junitxml=reporte-pruebas.xml \
                 --cov=app --cov-report=term --cov-report=xml --cov-fail-under=85

      - name: Análisis estático de seguridad (bandit, falla con hallazgos medios o altos)
        run: bandit -r app -ll -q

      - name: Dependencias con vulnerabilidades conocidas (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: |
            backend/reporte-pruebas.xml
            backend/coverage.xml

  frontend:
    name: Frontend · build y auditoría
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos (TypeScript) y build de producción
        run: npm run build
      - name: Dependencias con vulnerabilidades altas (npm audit)
        run: npm audit --audit-level=high

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Construir las imágenes de la API y la consola
        run: docker compose build
      - name: Levantar el stack y probar el health check
        run: |
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/v1/health && break; sleep 2; done
          curl -fsS http://localhost:8080/api/v1/health/db
          curl -fsS -o /dev/null http://localhost:8080/
      - name: Logs si falla
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
